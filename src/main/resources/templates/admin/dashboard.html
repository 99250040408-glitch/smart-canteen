<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Kitchen Orders Board - KARE Canteen Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:28px;">
            <div>
                <h1 style="font-family:'Outfit', sans-serif; font-size: 2rem; font-weight: 800; color: var(--navy-dark); line-height: 1.2;">
                    Kitchen Order Board
                </h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    KARE Canteen • Live Counter Token Monitor
                </p>
            </div>
            <div style="background:#eaf7ec; color:var(--veg-green); padding: 8px 16px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
                <span style="font-size:1.2rem; animation: pulse 1.5s infinite;">●</span> Auto-Refresh Active (5s)
            </div>
        </div>

        <div th:if="${success}" style="background:#dcfce7; color:#15803d; padding:12px 18px; border-radius:var(--radius-md); font-weight:600; margin-bottom:20px;">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="empty-state" style="padding: 80px 20px; text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 12px;">👨‍🍳</div>
            <h2 style="font-family:'Outfit', sans-serif; font-size: 1.6rem; color: var(--navy-dark); margin-bottom: 8px;">No Pending Orders</h2>
            <p style="color: var(--text-muted);">All kitchen orders are cleared. New orders will appear here automatically!</p>
        </div>

        <div th:unless="${#lists.isEmpty(orders)}" class="admin-orders-grid">
            <div th:each="order : ${orders}" class="admin-order-card"
                 th:classappend="${order.status == 'READY' ? 'ready-state' : ''}">
                
                <div class="admin-order-header">
                    <span class="admin-token-pill" th:text="${order.token.tokenNo}"></span>
                    <span class="status-badge"
                          th:classappend="${order.status == 'PLACED' ? 'status-placed' : 'status-ready'}"
                          th:text="${order.status}"></span>
                </div>

                <div style="font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px;">
                    <span th:text="${order.user.name}"></span>
                </div>

                <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px;">
                    Ordered at <span th:text="${#temporals.format(order.createdAt, 'hh:mm a')}"></span>
                </div>

                <div style="margin-bottom: 16px;">
                    <div th:each="item : ${order.orderItems}" class="admin-item-row">
                        <img th:src="${item.foodItem.imageUrl != null ? item.foodItem.imageUrl : '/images/placeholder.jpg'}"
                             onerror="this.onerror=null;this.src='/images/placeholder.jpg'"
                             class="admin-item-thumb">
                        <span style="flex:1;" th:text="${item.foodItem.name}"></span>
                        <span style="font-weight: 800; color: var(--navy-dark);" th:text="'× ' + ${item.quantity}"></span>
                    </div>
                </div>

                <div style="margin-top:auto; padding-top:12px; border-top: 1px dashed var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.85rem; color:var(--text-muted);">Total</span>
                    <strong style="font-family:'Outfit', sans-serif; font-size:1.15rem; color:var(--navy-dark);" th:text="'₹' + ${#numbers.formatDecimal(order.total, 0, 2)}"></strong>
                </div>

                <form th:if="${order.status == 'PLACED'}" th:action="@{'/admin/order/' + ${order.id} + '/status'}" method="post">
                    <input type="hidden" name="status" value="READY">
                    <button type="submit" class="btn-kitchen-action btn-mark-ready">
                        🔔 Mark Ready (Alert Student)
                    </button>
                </form>

                <form th:if="${order.status == 'READY'}" th:action="@{'/admin/order/' + ${order.id} + '/status'}" method="post">
                    <input type="hidden" name="status" value="COLLECTED">
                    <button type="submit" class="btn-kitchen-action btn-mark-collected">
                        ✓ Mark Collected
                    </button>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
        setTimeout(function() {
            location.reload();
        }, 5000);
    </script>
</body>
</html>
