<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Item' : 'Add Item'" > - Smart Canteen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="container">
        <div class="form-card">
            <h1 class="page-title" th:text="${isEdit} ? 'Edit Menu Item' : 'Add New Menu Item'"></h1>

            <form th:action="@{/admin/menu/save}" method="post" enctype="multipart/form-data">
                <input th:if="${isEdit}" type="hidden" name="id" th:value="${foodItem.id}">

                <div class="form-group">
                    <label for="name">Item Name</label>
                    <input type="text" id="name" name="name" required
                           th:value="${foodItem.name}" placeholder="e.g. Masala Dosa">
                </div>

                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price" name="price" required step="0.50" min="1"
                           th:value="${foodItem.price}" placeholder="e.g. 50.00">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="" disabled>Select category</option>
                        <option value="Breakfast" th:selected="${foodItem.category == 'Breakfast'}">Breakfast</option>
                        <option value="Meals" th:selected="${foodItem.category == 'Meals'}">Meals</option>
                        <option value="Snacks" th:selected="${foodItem.category == 'Snacks'}">Snacks</option>
                        <option value="Beverages" th:selected="${foodItem.category == 'Beverages'}">Beverages</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" name="available" value="true"
                               th:checked="${foodItem.available == null || foodItem.available}">
                        Available
                    </label>
                </div>

                <div class="form-group">
                    <label for="imageFile">Upload Image</label>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*">
                    <small>OR paste image path below</small>
                </div>

                <div class="form-group">
                    <label for="imageUrl">Image URL / Path</label>
                    <input type="text" id="imageUrl" name="imageUrl"
                           th:value="${foodItem.imageUrl}" placeholder="e.g. /images/dosa.jpg">
                </div>

                <div th:if="${isEdit && foodItem.imageUrl != null}" class="current-image">
                    <p>Current image:</p>
                    <img th:src="${foodItem.imageUrl}" alt="Current image"
                         onerror="this.onerror=null;this.src='/images/placeholder.jpg'"
                         style="max-width:200px; border-radius:8px;">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"
                            th:text="${isEdit} ? 'Update Item' : 'Add Item'"></button>
                    <a th:href="@{/admin/menu}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
